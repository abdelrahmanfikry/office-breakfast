<style>

  --bg:#f5f6f4;--card:#fff;--ink:#1c2321;--mut:#6b7671;--line:#e3e7e4;
  --pri:#0f766e;--pri2:#e6f4f2;--ok:#15803d;--okbg:#e8f6ec;--bad:#b42318;--badbg:#fdecea;--warn:#a15c07;--warnbg:#fff4e0;

  --sh:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}

header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}

.brand{font-weight:700;font-size:18px;color:var(--pri);display:flex;align-items:center;gap:8px}.brand img{width:30px;height:30px;border-radius:8px}.auth .logo img{display:block;width:84px;height:84px;margin:0 auto 8px;border-radius:20px;box-shadow:0 6px 18px rgba(15,118,110,.25)}

h2{font-size:18px;margin:18px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

html,body{overflow-x:clip}.row .btn{max-width:100%;white-space:normal;text-align:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}

html.ramadan{--bg:#0b1530;--card:#13224a;--ink:#f6efd9;--mut:#aab3cc;--line:#26386a;--pri:#f4b942;--pri2:#2b2a4d;--ok:#5ee39a;--okbg:#123a2e;--bad:#ff8a80;--badbg:#3d1d2c;--warn:#ffd166;--warnbg:#3a3020;--sh:0 4px 18px rgba(0,0,0,.35)}

.ann{display:flex;align-items:flex-start;gap:10px;background:var(--pri2);border-inline-start:4px solid var(--pri);border-radius:12px;padding:10px 12px;margin-bottom:12px;animation:annIn .35s ease}

.poll{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;animation:annIn .35s ease}
.poll-q{font-weight:600;margin-bottom:8px;line-height:1.6}
.poll-o{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;color:inherit;cursor:pointer;text-align:start}
.poll-o.me{border-color:var(--pri);font-weight:600}.poll-o:disabled{cursor:default}
.poll-bar{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pri2);transition:width .4s ease}
.poll-l,.poll-n{position:relative}.poll-n{color:var(--mut);font-size:13px}
.poll-f{color:var(--mut);font-size:12px;margin-top:4px}
.jar{margin-top:10px;background:linear-gradient(135deg,var(--pri2),var(--card))}
.subs{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.subs summary{cursor:pointer;font-size:14px}.subs-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.chip.on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.ptab{width:100%;border-collapse:collapse;font-size:14px}.ptab th{font-size:12px;color:var(--mut);font-weight:500;text-align:start;padding:4px 6px}
.ptab td{padding:7px 6px;border-top:1px solid var(--line)}.ptab th:not(:first-child),.ptab td:not(:first-child){text-align:center;width:56px}.ptab tr.off td:first-child{color:var(--mut);text-decoration:line-through}
.sw{width:40px;height:22px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;transition:background .2s}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:inset-inline-start .2s}
.sw.on{background:var(--pri)}.sw.on i{inset-inline-start:21px}.sw:disabled{opacity:.35;cursor:default}
@keyframes annIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#netbar{display:none;position:fixed;top:0;inset-inline:0;z-index:20;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--warn);text-align:center;font-size:13px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top))}
#netbar.on{display:block}
.wheelbox{position:relative;width:min(100%,360px);aspect-ratio:1;margin:0 auto}.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--bad);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:var(--card);border:4px solid var(--pri);display:grid;place-items:center;font-weight:700;color:var(--pri);font-size:13px;z-index:2}
.wstatus{min-height:28px;text-align:center;font-weight:700;margin:10px 0 6px;color:var(--mut)}.wbig{font-size:17px;padding:11px 26px;border-radius:30px}
.chip.off{text-decoration:line-through;opacity:.6}.wres{text-align:center;margin-top:12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wwin{font-size:28px;font-weight:900;color:var(--bad)}.order-box{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:start;font-size:14px;margin:8px 0 10px}
.runner{background:var(--badbg);color:var(--bad);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>

<body>
<div id="app"><div class="loading">جاري التحميل…</div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="netbar">مفيش نت — بتشوف آخر بيانات اتحمّلت، وأي تعديل هيتبعت لما النت يرجع</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, collectionGroup, doc, addDoc, setDoc, updateDoc, deleteDoc,
         onSnapshot, query, orderBy, where, serverTimestamp, writeBatch, getDocs, increment, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================== الإعدادات — غيّرها ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAwG62q5EdBoKQaq8Pf8sMQPgj5zKtseCI",
  authDomain: "office-breakfast-c9338.firebaseapp.com",
  projectId: "office-breakfast-c9338",
  storageBucket: "office-breakfast-c9338.firebasestorage.app",
  messagingSenderId: "119293186533",
  appId: "1:119293186533:web:faea52c1afa25eb7aa1f0c"
};
const CURRENCY = "ج.م";      // العملة اللي بتظهر جنب الأرقام
// الأصناف الثابتة اللي بتظهر للاختيار السريع (تتعدّل من صفحة المنيوهات)
const DEFAULT_CATALOG = ["فول", "بيض", "فول بالبيض", "بطاطس", "بطاطس جمبري", "فلافل"];
/* ============================================================ */

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
// كاش محلي: الموقع يفتح ويعرض آخر بيانات حتى لو النت قطع، والتعديلات تتبعت لما النت يرجع
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = initializeFirestore(app, {}); }

const S = { me:null, users:{}, orders:[], items:{}, transfers:[], rests:[], catalog:[], admins:null, carry:{}, notes:{}, notesFor:null, notesUnsub:null,
            loaded:{}, unsubs:[], otab:'people', hf:'all', q:'', authMode:'login' };
const isAdmin = () => !!S.admins?.includes(me());

/* ---------- أدوات ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = n => `${r2(n).toLocaleString('en-US',{maximumFractionDigits:2})} ${CURRENCY}`;
const me = () => S.me?.uid;
const uname = uid => S.users[uid]?.name || 'مستخدم';
const yesterdayStr = () => dayOfTs({ toMillis:()=>Date.now()-864e5 });
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const tsOf = x => x?.toMillis ? x.toMillis() : Date.now();
const dayLabel = s => { if (s === todayStr()) return 'النهارده'; if (s === yesterdayStr()) return 'امبارح'; const d = new Date(s + 'T00:00'); return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}); };
const timeOf = x => new Date(tsOf(x)).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
const STATUS = { open:'مفتوحة للطلب', closed:'اتقفلت واتطلبت', cancelled:'اتلغت' };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function errMsg(e){
  const c = e?.code || '';
  const m = {
    'permission-denied':'مش مسموح لك تعمل ده',
    'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الإيميل أو الباسورد غلط','auth/user-not-found':'الإيميل ده مش متسجّل',
    'auth/email-already-in-use':'الإيميل ده متسجّل قبل كده','auth/weak-password':'الباسورد لازم 6 حروف على الأقل',
    'auth/invalid-email':'الإيميل مكتوب غلط','auth/too-many-requests':'محاولات كتير — استنى شوية','unavailable':'مفيش اتصال بالنت'
  };
  return m[c] || m[c.replace('firestore/','')] || (e?.message || 'حصل خطأ');
}
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('اتنسخ'); }catch{ toast('النسخ مش متاح'); } }

/* ---------- حماية من الضغط: كل كتابة مهمة بتتسجل معاها «آخر مرة» والقواعد بتمنع التكرار السريع ---------- */
// i=أصناف (نص ثانية) · t=تحويلات (10ث) · c=شكاوى (دقيقة) · n=ملاحظات (5ث) · o=طلبيات (10ث)
async function wr(k, fn){
  const b = writeBatch(db), out = fn(b); b.set(doc(db,'rl',me()), { [k]: serverTimestamp() }, { merge:true });
  try { await b.commit(); return out; }
  catch (e) { if (e?.code === 'permission-denied') { toast('بالراحة شوية 😅 استنى ثانية وجرّب تاني'); const er = new Error('بالراحة شوية — استنى ثانية وجرّب تاني'); er.rl = true; throw er; } throw e; }
}
const addW = (k, col, data) => wr(k, b => { const ref = doc(col); b.set(ref, data); return ref; });
const updW = (k, ref, data) => wr(k, b => b.update(ref, data));
/* ---------- الحسابات ---------- */
function orderCalc(o){
  const its = (S.items[o.id] || []).slice().sort((a,b)=>tsOf(a.createdAt)-tsOf(b.createdAt));
  const per = {};
  for (const it of its){
    const p = per[it.uid] ??= { uid:it.uid, items:[], sub:0 };
    p.items.push(it); p.sub += (+it.qty||0) * (+it.price||0);
  }
  const parts = Object.values(per);
  const fee = Math.min(500, Math.max(0, +o.fee || 0)), share = parts.length ? fee / parts.length : 0;
  parts.forEach(p => p.total = p.sub + share);
  const subtotal = parts.reduce((a,p)=>a+p.sub,0);
  return { its, parts, fee, share, subtotal, total: subtotal + fee };
}
// pair[a][b] موجب = b عليه لـ a
function ledger(){
  const net = {}, pair = {};
  const add = (cr, dr, amt) => {
    if (!cr || !dr || cr === dr || !amt) return;
    net[cr] = (net[cr]||0) + amt; net[dr] = (net[dr]||0) - amt;
    (pair[cr] ??= {})[dr] = (pair[cr][dr]||0) + amt;
    (pair[dr] ??= {})[cr] = (pair[dr][cr]||0) - amt;
  };
  for (const o of S.orders){
    if (o.status !== 'closed' || !o.payerUid) continue;
    for (const p of orderCalc(o).parts) add(o.payerUid, p.uid, Math.max(0, p.total));
  }
  for (const t of S.transfers) if (t.confirmed) trAdd(add, t);
  for (const c of (S.cash || [])) add(c.fromUid, c.toUid, +c.amount || 0); // دفع كاش سجّله الأدمن
  // كارت العفو: اللي استخدمه عليه الغرامة لأمين صندوق الفطار
  for (const u of Object.values(S.users || {})) for (const p of (u.pardons || [])) if (p.at > (S.resetAt || 0) && +p.fee > 0) add(p.to, u.id, Math.min(100, +p.fee));
  for (const p of (S.jarPay || [])){
    if (p.oid){ // الحصالة دفعت طلبية: اللي معاه الفكة يدّيها للي دفع الطلبية، واللي اتغطّى نصيبه مايدفعش الجزء ده
      for (const [holder, amt] of Object.entries(p.holders || {})) add(p.payer, holder, +amt || 0);
      for (const [u, amt] of Object.entries(p.covered || {})) add(u, p.payer, +amt || 0);
    } else for (const [holder, amt] of Object.entries(p.holders || {})) add(p.winner, holder, +amt || 0); // الحصالة: اللي معاه الفكة عليه للكسبان
  }
  // الأرصدة المرحّلة من البيانات القديمة اللي اتمسحت
  for (const [k, v] of Object.entries(S.carry)){ const [a, b] = k.split('_'); if (v > 0) add(a, b, v); else if (v < 0) add(b, a, -v); }
  return { net, pair };
}
// تحويل عادي: from سدّد لـ to · تحويل «على حساب» شخص: from سدّد دينه لـ ob، والفلوس بقت على to لـ ob
function trAdd(add, t){
  const a = Math.max(0, +t.amount || 0);
  if (t.onBehalf && t.onBehalf !== t.fromUid && t.onBehalf !== t.toUid){ add(t.fromUid, t.onBehalf, a); add(t.onBehalf, t.toUid, a); }
  else add(t.fromUid, t.toUid, a);
}
// التسوية التلقائية: من صافي رصيد كل واحد ← أقل عدد تحويلات (أي تحويل لأي حد بيتحسب في الصافي)
// أي فرق أقل من 10 قروش (كسور تقسيم التوصيل) بيتعتبر صفر — مفيش حد يحوّل 0.01
const EPS = 0.1;
function settlement(){
  const { net } = ledger(), out = [];
  const cr = Object.entries(net).filter(([,v]) => v > EPS).map(([id,v]) => ({ id, v:r2(v) }));
  const de = Object.entries(net).filter(([,v]) => v < -EPS).map(([id,v]) => ({ id, v:r2(-v) }));
  const push = (d, c, a) => { a = r2(a); if (a > EPS) out.push({ from:d.id, to:c.id, amount:a }); d.v = r2(d.v - a); c.v = r2(c.v - a); };
  for (const d of de){ const c = cr.find(c => c.v > EPS && Math.abs(c.v - d.v) < EPS); if (c) push(d, c, Math.min(d.v, c.v)); }
  for (let g = 0; g < 500; g++){
    const D = de.filter(x => x.v > EPS).sort((a,b) => b.v - a.v), C = cr.filter(x => x.v > EPS).sort((a,b) => b.v - a.v);
    if (!D.length || !C.length) break;
    push(D[0], C[0], Math.min(D[0].v, C[0].v));
  }
  return out;
}
// علاقتي بالناس حسب التسوية: سالب = عليّ ليه · موجب = عليه ليّ
function mySettle(){
  const m = {}; for (const t of settlement()){ if (t.from === me()) m[t.to] = (m[t.to]||0) - t.amount; if (t.to === me()) m[t.from] = (m[t.from]||0) + t.amount; }
  return m;
}
// مفتاح الترحيل: "a_b" مترتب — موجب = b عليه لـ a
const carryKey = (cr, dr) => cr < dr ? [`${cr}_${dr}`, 1] : [`${dr}_${cr}`, -1];
function contribution(orders, transfers){
  const out = {};
  const add = (cr, dr, amt) => { if (!cr || !dr || cr===dr || !amt) return; const [k, s] = carryKey(cr, dr); out[k] = (out[k]||0) + s*amt; };
  for (const o of orders){ if (o.status !== 'closed' || !o.payerUid) continue; for (const p of orderCalc(o).parts) add(o.payerUid, p.uid, Math.max(0, p.total)); }
  for (const t of transfers) if (t.confirmed) trAdd(add, t);
  return out;
}

const lastPayAt = () => Math.max(0, ...(S.jarPay || []).map(p => p.at || 0));
function jarNow(){
  const since = lastPayAt(), holders = {}, list = []; let total = 0, n = 0;

  for (const [h, a] of Object.entries(lastP?.left || {})) if (+a > 0){ holders[h] = r2((holders[h]||0) + +a); total += +a; }
  const leftTotal = r2(total);

}

  const per = {}, qty = {}, who = {}; let total = 0, n = 0;

    for (const p of orderCalc(o).parts){ const x = per[p.uid] ??= { spent:0, n:0, qty:{} }; x.spent += p.total; x.n++; total += p.total;
      for (const it of p.items){ const q = +it.qty || 0; x.qty[it.name] = (x.qty[it.name]||0) + q; qty[it.name] = (qty[it.name]||0) + q; (who[it.name] ??= {})[p.uid] = (who[it.name][p.uid]||0) + q; } } }
  const top = Object.entries(qty).sort((a,b) => b[1] - a[1])[0]?.[0];

function vHistory(){

/* ---------- الحساب ---------- */
function vMoney(){
  const { net } = ledger(), mine = mySettle();
  const rows = Object.entries(mine).filter(([,v]) => Math.abs(v) > EPS).sort((a,b)=>a[1]-b[1]);
  const pendOut = S.transfers.filter(t => t.fromUid===me() && !t.confirmed);
  const others = Object.values(S.users).sort((a,b)=>(net[a.id]||0)-(net[b.id]||0));
  return `<a href="#report" class="card" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><b>تقرير الشهر</b><span class="mut">مين صرف كام، وألقاب الشهر ←</span></a>
  <h2>حسابي مع الناس</h2>
  <p class="mut" style="font-size:12px;margin:-6px 0 8px">بيتسوّى لوحده بأقل عدد تحويلات — أي تحويل لأي حد بيتحسب.</p>
  <div class="card">${rows.length ? rows.map(([uid,v]) => {
    const pay = S.users[uid]?.payInfo;
    return `<div class="person"><div class="between">
      <div>${v<0 ? `انت عليك لـ <b>${esc(uname(uid))}</b>` : `<b>${esc(uname(uid))}</b> عليه ليك`}
      ${v<0 && pay ? `<div class="mut" style="font-size:13px">بيانات التحويل: ${esc(pay)} <a href="#" data-act="copyTxt" data-id="${esc(pay)}">نسخ</a></div>`:''}</div>
      <div style="text-align:end"><b class="${v<0?'bad':'ok'}">${money(Math.abs(v))}</b>
      ${v<0 ? (() => { const pend = S.transfers.filter(t => t.fromUid===me() && t.toUid===uid && !t.confirmed && !t.rejected).reduce((a,t) => a + (+t.amount||0), 0);
        return pend > 0 ? `<div class="mut" style="font-size:12px">سجّلت ${money(pend)} — مستني تأكيده</div>` : `<div><button class="btn sm pri" data-act="newTransfer" data-id="${uid}" data-x="${r2(-v)}">سجّل إنك حوّلت</button></div>`; })() : ''}</div>
    </div></div>`; }).join('') : '<div class="empty">حسابك صافي مع الكل</div>'}</div>
  ${pendOut.length ? `<p class="mut" style="font-size:13px">عندك ${pendOut.length} تحويل مستني تأكيد — مش محسوب في الأرقام لحد ما يتأكد.</p>`:''}
  <h2>رصيد الكل</h2>
  <div class="card"><table><tr><th>الاسم</th><th class="num">الرصيد</th></tr>
  ${others.map(u => { let v = r2(net[u.id]||0); if (Math.abs(v) < EPS) v = 0; return `<tr><td>${esc(u.name)}${u.id===me()?' (انت)':''}</td><td class="num ${v>0?'ok':v<0?'bad':'mut'}">${v>0?'ليه ':v<0?'عليه ':''}${money(Math.abs(v))}</td></tr>`; }).join('')}
  </table><p class="mut" style="font-size:12px;margin-bottom:0">بيتحسب من الطلبيات المقفولة بس + التحويلات المتأكدة.</p></div>
  <button class="btn pri fab" data-act="newTransfer">+ تحويل</button>`;
}

/* ---------- التحويلات ---------- */
function vTransfers(){
  const inv = t => t.fromUid===me() || t.toUid===me() || t.onBehalf===me();
  // الكاش اللي سجّله الأدمن بيظهر وسط التحويلات كتحويل متأكد عليه علامة «كاش»
  const cashT = (S.cash||[]).map(c => ({ id:c.id, fromUid:c.fromUid, toUid:c.toUid, amount:c.amount, note:[c.note, 'سجّلها ' + uname(c.by)].filter(Boolean).join(' · '), confirmed:true, cash:true, createdAt:{ toMillis:() => c.at } }));
  const list = [...S.transfers, ...cashT].sort((a,b) => tsOf(b.createdAt) - tsOf(a.createdAt));
  const mine = list.filter(inv);
  const all = list.filter(t => !inv(t));
  const row = t => {
    const toMe = t.toUid===me(), fromMe = t.fromUid===me();
    return `<div class="person"><div class="between">
      <div><b>${esc(uname(t.fromUid))}</b> حوّل لـ <b>${esc(uname(t.toUid))}</b>${t.onBehalf ? `<div style="font-size:13px;color:var(--pri)">على حساب <b>${esc(uname(t.onBehalf))}</b> — بقت على ${esc(uname(t.toUid))} لـ ${esc(uname(t.onBehalf))}</div>` : ''}
      <div class="mut" style="font-size:13px">${dayLabel(dayOfTs(t.createdAt))} ${timeOf(t.createdAt)}${t.note?' · '+esc(t.note):''}</div></div>
      <div style="text-align:end"><b style="${t.rejected?'text-decoration:line-through;opacity:.7':''}">${money(t.amount)}</b>${+t.jar > 0 ? `<div class="mut" style="font-size:11px">+ ${money(t.jar)} 🐷</div>` : ''}<div>${t.cash ? '<span class="pill closed">كاش ✓</span>' : t.confirmed ? '<span class="pill closed">متأكد</span>' : t.rejected ? `<span class="pill cancelled">${esc(thiefLine(t.id))}</span>` : '<span class="pill warn">مستني تأكيد</span>'}</div></div></div>
      ${t.rejected ? `<div class="bad" style="font-size:13px;margin-top:4px">${esc(uname(t.toUid))} بيقول الفلوس موصلتش — ومش محسوبة في الحساب.</div>` : ''}
      ${!t.confirmed && !t.rejected && toMe ? `<div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="confirmTr" data-id="${t.id}">وصلني</button><button class="btn sm dan" data-act="rejectTr" data-id="${t.id}">موصلش</button></div>`:''}
      ${t.rejected && toMe ? `<div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="confirmTr" data-id="${t.id}">لأ خلاص وصلني</button></div>`:''}
      ${!t.confirmed && fromMe ? `<div class="row" style="margin-top:6px">${t.rejected ? `<button class="btn sm pri" data-act="swearTr" data-id="${t.id}">والله حوّلت!</button>` : ''}<button class="btn sm dan" data-act="delTr" data-id="${t.id}">امسحه</button></div>`:''}
    </div>`;
  };
  return `<h2>تحويلاتي</h2><div class="card">${mine.length ? mine.map(row).join('') : '<div class="empty">مفيش تحويلات</div>'}</div>
  ${all.length ? `<h2>باقي التحويلات</h2><div class="card">${all.slice(0,50).map(row).join('')}</div>`:''}
  <button class="btn pri fab" data-act="newTransfer">+ تحويل</button>`;
}
// جمل هزار للتحويل اللي موصلش — ثابتة لكل تحويل
const THIEF = ['امسك حرامي!', 'تحويل بالنية', 'الفلوس ضلّت الطريق', 'حوّل على الهوا', 'لسه في الطريق… من سنة', 'البنك بيقول مشفناهوش'];
const thiefLine = id => THIEF[[...String(id)].reduce((a,c)=>a + c.charCodeAt(0), 0) % THIEF.length];
function dayOfTs(x){ const d = new Date(tsOf(x)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function wDraw(){

  const ctx = cv.getContext('2d'), ids = wActive(), n = ids.length, R = cv.width / 2, seg = 2 * Math.PI / Math.max(n, 1);
  ctx.clearRect(0, 0, cv.width, cv.height); ctx.save(); ctx.translate(R, R);
  ctx.beginPath(); ctx.arc(0, 0, R - 4, 0, 2 * Math.PI); ctx.fillStyle = '#1c2321'; ctx.fill();
  if (!n){ ctx.fillStyle = '#fff'; ctx.font = '700 34px Cairo, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('محدش فاضل!', 0, 12); ctx.restore(); return; }
  for (let i = 0; i < n; i++){
    const a0 = W.rot + i * seg;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R - 16, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = WCOLORS[i % WCOLORS.length]; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.rotate(a0 + seg / 2); ctx.fillStyle = '#fff'; ctx.font = `700 ${n > 8 ? 26 : 32}px Cairo, sans-serif`;

    const nm = uname(ids[i]); ctx.fillText(nm.length > 14 ? nm.slice(0, 13) + '…' : nm, R - 40, 0); ctx.restore();

}

// طلبي المعتاد: أكتر تركيبة طلبتها في آخر 10 طلبيات (من نفس المطعم لو موجود) — التعادل للأحدث
function lastMyItems(o){
  const prev = S.orders.filter(x => x.id!==o.id && x.status!=='cancelled' && (S.items[x.id]||[]).some(i=>i.uid===me()));
  const same = o.restaurantId ? prev.filter(x => x.restaurantId===o.restaurantId) : prev;
  const pool = (same.length ? same : prev).slice(0, 10); if (!pool.length) return [];
  const cnt = {}, first = {};
  for (const x of pool){ const its = (S.items[x.id]||[]).filter(i=>i.uid===me()); const k = its.map(i => i.name + '×' + (+i.qty)).sort().join('|'); cnt[k] = (cnt[k]||0) + 1; first[k] ??= its; }
  const best = Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a])[0]; // sort ثابت ← التعادل للأحدث
  return first[best] || [];
}

  spinWheel: (again) => {
    const ids = wActive(); if (W.spinning) return;

    if (ids.length === 1){ // فاضل واحد بس في الدور ← هو اللي ينزل من غير لف

      wStatus(`${uname(uid)} آخر واحد في الدور — هو اللي هينزل`); return wResult({ ...oo, runnerUid:uid, runnerLine:line });
    }

    if (again === 'again') wStatus('اللفة التانية بتتسجل في المحضر… وكله شايف');
    const btn = $('#wspin'); if (btn) btn.disabled = true;
    const n = ids.length, seg = 2 * Math.PI / n, win = crypto.getRandomValues(new Uint32Array(1))[0] % n;
    const base = -Math.PI / 2 - (win + .5) * seg + (Math.random() - .5) * seg * .7;
    const start = W.rot, target = base + 2 * Math.PI * (Math.ceil((start - base) / (2 * Math.PI)) + 6 + Math.floor(Math.random() * 3));
    const dur = 6000, t0 = performance.now(); let lastSeg = -1, lineAt = t0;
    const frame = now => {
      if (!$('#wheel')) { W.spinning = false; return; }
      const t = Math.min(1, (now - t0) / dur); W.rot = start + (target - start) * (1 - Math.pow(1 - t, 4)); wDraw();
      const s = Math.floor((((-Math.PI / 2 - W.rot) % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI) / seg);
      if (s !== lastSeg){ lastSeg = s; tick(); }
      if (now - lineAt > 900){ lineAt = now; wStatus(pick(SPIN_LINES)); }
      if (t < 1) return requestAnimationFrame(frame);
      W.spinning = false; if (btn) btn.disabled = false; wStatus('');
      const uid = ids[win];
      if (isGirl(uid)){ // هزار: البنات متنزلش — تطلع من القرعة والعجلة تلف لوحدها
        W.ex.add(uid); const r2 = $('#wresult');

      pushSend('🎡 العجلة اختارتك!', `انزل هات «${S.orders.find(x=>x.id===W.oid)?.title || 'الطلبية'}» — ${line}`, '#order/' + W.oid, [uid], 'runner');
      updateDoc(doc(db,'orders',W.oid), { runnerUid:uid, runnerLine:line, runnerAt:serverTimestamp(), runnerSpins:increment(1) })

      const o = S.orders.find(x => x.id === W.oid);
      wResult({ ...o, runnerUid:uid, runnerLine:line }); confetti();
    };
    requestAnimationFrame(frame);
  },

  // ملخص الشهر: إشعار شخصي لكل واحد — صرف كام، كام طلبية، أكتر صنف، ولقب على الماشي

  // بداية جديدة: مسح كل الطلبيات غير المفتوحة + كل التحويلات + تصفير الأرصدة المرحّلة
  resetAll: async () => {
    const orders = S.orders.filter(o => o.status !== 'open'), trs = S.transfers;
    if (!confirm(`بداية جديدة: هيتمسح ${orders.length} طلبية قديمة و${trs.length} تحويل، وكل الحسابات تبقى صفر.\nالطلبيات المفتوحة دلوقتي هتفضل زي ما هي.\nده مالوش رجوع — نزّل ملف Excel من التقرير الأول لو عاوز تحتفظ بنسخة.\nمتأكد؟`)) return;
    const refs = [];
    for (const o of orders){
      (S.items[o.id] || []).forEach(i => refs.push(doc(db,'orders',o.id,'items',i.id)));
      (await getDocs(collection(db,'orders',o.id,'notes'))).forEach(n => refs.push(n.ref));
      refs.push(doc(db,'orders',o.id));
    }
    trs.forEach(t => refs.push(doc(db,'transfers',t.id)));
    // الأصناف والملاحظات قبل الطلبية نفسها، والتصفير في آخر دفعة
    for (let i = 0; i < refs.length; i += 400){
      const b = writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r));
      if (i + 400 >= refs.length){ b.set(doc(db,'carry','pairs'), { pairs:{} }); b.set(doc(db,'carry','cash'), { items:[] }); b.set(doc(db,'carry','jar'), { payouts:[] }); b.set(doc(db,'config','app'), { resetAt: Date.now() }, { merge:true }); }
      await b.commit();
    }
    if (!refs.length){ await setDoc(doc(db,'carry','pairs'), { pairs:{} }); await setDoc(doc(db,'carry','cash'), { items:[] }); }
    toast('بداية جديدة — كل الحسابات صفر');
  },
  cleanup: async days => {
    const cut = dayOfTs({ toMillis:()=>Date.now() - (+days)*864e5 }), cutMs = Date.now() - (+days)*864e5;
    const orders = S.orders.filter(o => o.day < cut && o.status !== 'open');
    const trs = S.transfers.filter(t => t.confirmed && tsOf(t.createdAt) < cutMs);
    if (!orders.length && !trs.length) return toast('مفيش بيانات قديمة');
    if (!confirm(`هيتمسح ${orders.length} طلبية و${trs.length} تحويل أقدم من ${days} يوم، والأرصدة هتترحّل. متأكد؟`)) return;
    // كل دفعة ذرّية: الترحيل + المسح مع بعض — لو دفعة فشلت مفيش ازدواج في الحساب
    const units = [...orders.map(o => ({ o })), ...trs.map(t => ({ t }))];
    let batch = writeBatch(db), ops = 0, inc = {}, done = 0;
    const flush = async () => {
      if (!ops) return;
      const upd = {}; for (const [k,v] of Object.entries(inc)) if (Math.abs(v) > 0.0001) upd[k] = increment(r2(v));
      if (Object.keys(upd).length) batch.set(doc(db,'carry','pairs'), { pairs: Object.fromEntries(Object.entries(upd)) }, { merge:true });
      await batch.commit(); batch = writeBatch(db); ops = 0; inc = {};
    };
    for (const u of units){
      const refs = [];
      if (u.o){
        (S.items[u.o.id] || []).forEach(i => refs.push(doc(db,'orders',u.o.id,'items',i.id)));
        (await getDocs(collection(db,'orders',u.o.id,'notes'))).forEach(n => refs.push(n.ref));
        refs.push(doc(db,'orders',u.o.id));
      } else refs.push(doc(db,'transfers',u.t.id));
      if (ops + refs.length > 400) await flush();
      const c = contribution(u.o ? [u.o] : [], u.t ? [u.t] : []);
      for (const [k,v] of Object.entries(c)) inc[k] = (inc[k]||0) + v;
      refs.forEach(r => batch.delete(r)); ops += refs.length; done++;
    }
    await flush();
    toast(`اتمسح ${done} سجل والأرصدة اترحّلت`);
  },

// "الاسم | السعر" لكل سطر — السعر اختياري (0 = استخدم السعر الافتراضي)
function parseLines(txt){
  return String(txt||'').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)\s*[|:،,\-–]\s*([\d.]+)\s*$/); return m ? { name:m[1].trim(), price:+m[2] } : { name:l.replace(/[|:،,\-–]\s*$/,'').trim(), price:0 };
  }).filter(x => x.name);
}
// جدول أسعار: صف لكل صنف + 3 صفوف فاضية لأصناف جديدة
// جدول أسعار: صف لكل صنف + زرار يضيف صفوف بلا حد + بحث + إضافة كذا صنف مرة واحدة
let rowSeq = 0;
const priceRow = (m = {}) => { const i = rowSeq++; return `<div class="prow" style="display:grid;grid-template-columns:1fr 110px;gap:10px;margin-bottom:6px"><input name="n_${i}" value="${esc(m.name||'')}" placeholder="اسم الصنف" style="margin:0"><input name="p_${i}" type="number" min="0" step="any" value="${+m.price ? m.price : ''}" placeholder="السعر" style="margin:0"></div>`; };
function priceRows(items){
  return `${items.length > 8 ? `<input id="rowq" placeholder="دوّر على صنف (${items.length} صنف)" style="margin:0 0 10px">` : ''}
    <div style="display:grid;grid-template-columns:1fr 110px;gap:10px"><span class="mut" style="font-size:13px">الصنف</span><span class="mut" style="font-size:13px">السعر (${CURRENCY})</span></div>
    <div id="prows">${items.map(priceRow).join('')}${priceRow()}</div>
    <div class="row" style="margin:4px 0 12px"><button type="button" class="btn sm" data-act="addRow">+ صنف جديد</button><button type="button" class="btn sm" data-act="bulkRows">+ كذا صنف مرة واحدة</button></div>
    <label id="bulkbox" style="display:none">الصق أو اكتب الأصناف — كل صنف في سطر: الاسم | السعر<textarea name="bulk" rows="6" placeholder="فول | 10&#10;طعمية | 3&#10;عيش | 1"></textarea></label>`;
}
function readPriceRows(f){
  const out = new Map();
  for (const [k, v] of f.entries()){ if (!k.startsWith('n_')) continue; const name = String(v).trim(); if (name && !out.has(name)) out.set(name, +f.get('p_' + k.slice(2)) || 0); }
  for (const m of parseLines(f.get('bulk'))) if (!out.has(m.name) || m.price) out.set(m.name, m.price || out.get(m.name) || 0);
  return [...out].map(([name, price]) => ({ name, price }));
}
// إضافة صنف من الفورم + حفظ سعره لو كان ناقص أو اتغيّر (علشان يتكتب مرة واحدة)
async function addItemFromForm(o, f){
  const name = f.get('name').trim(), price = +f.get('price');
  await addW('i', collection(db,'orders',o.id,'items'), { uid:me(), orderId:o.id, name, qty:+f.get('qty'), price, note:f.get('note').trim(), createdAt:serverTimestamp() });
  await savePrice(o, name, price).catch(()=>{});
}
// المنيوهات: الأدمن وصاحب المنيو بس يعدّلوا · الأصناف الثابتة للأدمن بس
const canRest = r => isAdmin() || (!!r && r.createdBy === me());
async function savePrice(o, name, price){
  if (!price || price === priceFor(o, name)) return;
  const r = S.rests.find(x => x.id === o.restaurantId);
  if (r && !canRest(r)) return;
  if (!r && !isAdmin()) return;
  if (r){ // سعر خاص بالمطعم
    const items = (r.items||[]).map(m => ({...m})), m = items.find(x => x.name === name);
    if (m) m.price = price; else items.push({ name, price });
    await updateDoc(doc(db,'restaurants',r.id), { items });
  }
  const cat = S.catalog.map(m => ({...m})), c = cat.find(m => m.name === name);
  if (!isAdmin()) return;
  if (c && !+c.price){ c.price = price; await setDoc(doc(db,'config','catalog'), { items:cat, updatedBy:me(), updatedAt:serverTimestamp() }); }
  else if (!c && !r){ cat.push({ name, price }); await setDoc(doc(db,'config','catalog'), { items:cat, updatedBy:me(), updatedAt:serverTimestamp() }); }
}
// سعر الصنف: سعر المطعم لو موجود، وإلا السعر الافتراضي
function priceFor(o, name){
  const r = S.rests.find(x => x.id === o.restaurantId);
  const rp = r?.items?.find(m => m.name === name)?.price;
  if (+rp) return +rp;
  return +(S.catalog.find(m => m.name === name)?.price) || 0;
}
// الأصناف المعروضة للاختيار: الثابتة + أصناف المطعم، بأسعار المطعم
// مطعم ليه منيو ← أصنافه هو بس · غير كده ← الأصناف الثابتة
function menuOf(o){
  const ri = (S.rests.find(x=>x.id===o.restaurantId)?.items) || [];
  return ri.length ? ri : S.catalog;
}
function quickList(o){
  const names = [...new Set(menuOf(o).map(m=>m.name))];
  return names.map(name => ({ name, price: priceFor(o, name) }));
}
function restModal(r = {}){
  const base = r.id ? (r.items||[]) : S.catalog.map(m => ({ name:m.name, price:m.price }));
  modal(r.id ? 'تعديل المطعم' : 'مطعم جديد', `
    <label>الاسم<input name="name" required value="${esc(r.name||'')}"></label>
    <label>التليفون (واتساب)<input name="phone" type="tel" placeholder="01xxxxxxxxx" value="${esc(r.phone||'')}"></label>
    <div class="mut" style="font-size:13px;margin-bottom:6px">أسعار المطعم ده (اللي تسيبه فاضي هياخد السعر الافتراضي):</div>
    ${priceRows(base)}`,
    async f => {
      const items = readPriceRows(f);
      const data = { name:f.get('name').trim(), phone:f.get('phone').trim(), items };
      if (r.id) await updateDoc(doc(db,'restaurants',r.id), data);
      else await addDoc(collection(db,'restaurants'), { ...data, createdBy:me(), createdAt:serverTimestamp() });
    });
}

document.addEventListener('click', async e => {
  if (e.target.closest('[data-close]') || e.target.id === 'modal') return closeModal();
  const t = e.target.closest('[data-act]'); if (!t) return;
  e.preventDefault();
  // منع الدبل كليك: الضغطات على نفس الزرار بتتنفّذ ورا بعض، مش مع بعض
  // (الضغطة التانية بتشوف نتيجة الأولى — فمفيش صنف يتضاف مرتين ولا طلب يتكرر)
  const key = `${t.dataset.act}|${t.dataset.id||''}|${t.dataset.x||''}`;
  const run = () => Promise.race([Promise.resolve(A[t.dataset.act]?.(t.dataset.id, t.dataset.x, t)), new Promise(r => setTimeout(r, 1500))]);
  const p = (busy.get(key) || Promise.resolve()).then(run).catch(err => toast(errMsg(err)));
  busy.set(key, p); p.finally(() => { if (busy.get(key) === p) busy.delete(key); });
});
const busy = new Map();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- تقرير الشهر ---------- */
function vReport(){
  const months = [...new Set(S.orders.filter(o => o.status === 'closed').map(o => (o.day||'').slice(0,7)))].filter(Boolean).sort().reverse();
  const cur = todayStr().slice(0,7);
  if (!months.includes(cur)) months.unshift(cur);
  const m = S.rm && months.includes(S.rm) ? S.rm : months[0];
  const mName = ym => new Date(ym + '-01T00:00').toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
  const orders = S.orders.filter(o => o.status === 'closed' && (o.day||'').startsWith(m));
  const per = {}, items = {}, days = {};
  let total = 0;
  for (const o of orders){
    const c = orderCalc(o); total += c.total; days[o.day] = (days[o.day]||0) + c.total;
    for (const p of c.parts){ const x = per[p.uid] ??= { uid:p.uid, spent:0, orders:0, runs:0, qty:{} }; x.spent += p.total; x.orders++; for (const it of p.items){ x.qty[it.name] = (x.qty[it.name]||0) + (+it.qty||0); } }
    for (const it of c.its) items[it.name] = (items[it.name]||0) + (+it.qty||0);
    if (o.runnerUid){ (per[o.runnerUid] ??= { uid:o.runnerUid, spent:0, orders:0, runs:0, qty:{} }).runs++; }
  }
  const people = Object.values(per).sort((a,b) => b.spent - a.spent);
  const topItems = Object.entries(items).sort((a,b) => b[1] - a[1]);
  const dayList = Object.entries(days).sort((a,b) => b[1] - a[1]);
  const mine = per[me()];
  const best = (fn) => people.filter(fn).length ? people.filter(fn).reduce((a,b) => fn(b) > fn(a) ? b : a) : null;
  const tKing = best(p => p.qty['طعمية'] || p.qty['فلافل'] || 0);
  const runner = best(p => p.runs);
  const saver = people.filter(p => p.orders).sort((a,b) => a.spent/a.orders - b.spent/b.orders)[0];
  const big = people[0];
  const title = (label, p, val) => p ? `<div class="person"><div class="between"><span>${label}</span><b>${esc(uname(p.uid))}${val ? ` <span class="mut" style="font-weight:400">(${val})</span>` : ''}</b></div></div>` : '';
  return `<div class="between" style="margin:18px 0 10px"><h2 style="margin:0">تقرير الشهر</h2>
    <div class="row" style="margin:0;flex-wrap:nowrap"><button class="btn sm" data-act="exportCsv" data-id="${m}" title="ملف يتفتح بـ Excel">تصدير Excel</button>
    <select id="rmonth" style="width:auto;margin:0">${months.map(x => `<option value="${x}" ${x===m?'selected':''}>${mName(x)}</option>`).join('')}</select></div></div>
  ${!orders.length ? '<div class="card empty">مفيش طلبيات مقفولة في الشهر ده لسه</div>' : `
  <div class="stats">
    <div class="stat ok"><small>انت صرفت</small><b>${money(mine?.spent||0)}</b><small>${mine?.orders||0} طلبية${mine?.runs ? ` · نزلت ${mine.runs} مرة` : ''}</small></div>
    <div class="stat" style="background:var(--pri2);color:var(--pri)"><small>المكتب كله صرف</small><b>${money(total)}</b><small>${orders.length} طلبية · ${people.length} شخص</small></div>
  </div>
  <h2>ألقاب الشهر</h2>
  <div class="card">
    ${title('ملك الطعمية', tKing, tKing ? `${r2(tKing.qty['طعمية'] || tKing.qty['فلافل'])} واحدة` : '')}
    ${title('بطل العربية (أكتر واحد نزل)', runner, runner ? `${runner.runs} مرة` : '')}
    ${title('رجل الأعمال (أكتر واحد صرف)', big, big ? money(big.spent) : '')}
    ${title('المحافظ الاقتصادي (أقل متوسط للطلبية)', saver, saver ? money(saver.spent / saver.orders) + ' للطلبية' : '')}
  </div>
  <h2>كل واحد صرف كام</h2>
  <div class="card"><table><tr><th>الاسم</th><th class="num">طلبيات</th><th class="num">نزل</th><th class="num">صرف</th></tr>
    ${people.map(p => `<tr><td>${esc(uname(p.uid))}${p.uid===me()?' (انت)':''}</td><td class="num">${p.orders}</td><td class="num">${p.runs||'—'}</td><td class="num"><b>${money(p.spent)}</b></td></tr>`).join('')}</table></div>
  <h2>أكتر الأصناف طلبًا</h2>
  <div class="card">${topItems.slice(0,8).map(([n,q], i) => `<div class="it"><span class="n">${i+1}. ${esc(n)}</span><span class="p"><b>${r2(q)}</b></span></div>`).join('')}</div>
  <h2>الأيام</h2>
  <div class="card">
    <div class="it"><span class="n">أغلى يوم: ${dayLabel(dayList[0][0])}</span><span class="p bad"><b>${money(dayList[0][1])}</b></span></div>
    ${dayList.length > 1 ? `<div class="it"><span class="n">أرخص يوم: ${dayLabel(dayList[dayList.length-1][0])}</span><span class="p ok"><b>${money(dayList[dayList.length-1][1])}</b></span></div>` : ''}
    <div class="it mut"><span class="n">متوسط اليوم</span><span class="p">${money(total / dayList.length)}</span></div>
  </div>
  <p class="mut" style="font-size:12px">التقرير بيحسب الطلبيات المقفولة بس. لو الأدمن عمل تنظيف للبيانات القديمة، الطلبيات اللي اتمسحت مش هتظهر هنا.</p>`}`;
}

}

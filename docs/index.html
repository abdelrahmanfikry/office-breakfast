<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>فطار المكتب</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:title" content="فطار المكتب">
<meta property="og:description" content="الطلبات والتجميع والحساب في مكان واحد">
<meta property="og:image" content="https://abdelrahmanfikry.github.io/office-breakfast/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f4;--card:#fff;--ink:#1c2321;--mut:#6b7671;--line:#e3e7e4;
  --pri:#0f766e;--pri2:#e6f4f2;--ok:#15803d;--okbg:#e8f6ec;--bad:#b42318;--badbg:#fdecea;--warn:#a15c07;--warnbg:#fff4e0;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111514;--card:#1a201e;--ink:#e8edeb;--mut:#93a09a;--line:#2a3330;
  --pri:#2dd4bf;--pri2:#123631;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1714;--warn:#fbbf24;--warnbg:#3a2a0c;
  --sh:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:18px;color:var(--pri);display:flex;align-items:center;gap:8px}.brand img{width:30px;height:30px;border-radius:8px}.auth .logo img{display:block;width:84px;height:84px;margin:0 auto 8px;border-radius:20px;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.sp{flex:1}
.who{color:var(--mut);font-size:13px}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:140px;text-align:center;padding:9px 2px;font-size:13px;color:var(--mut);position:relative}
nav.tabs a.on{color:var(--pri);font-weight:700}
nav.tabs a.on::before{content:"";position:absolute;top:0;inset-inline:25%;height:3px;border-radius:3px;background:var(--pri)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
h2{font-size:18px;margin:18px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:var(--r);padding:12px 14px}
.stat small{display:block;font-size:13px;opacity:.85}
.stat b{font-size:22px}
.stat.ok{background:var(--okbg);color:var(--ok)}.stat.bad{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600}
.pill.open{background:var(--okbg);color:var(--ok)}.pill.closed{background:var(--pri2);color:var(--pri)}.pill.cancelled{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.dan{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;bottom:70px;inset-inline-start:max(16px,calc(50% - 414px));z-index:6;border-radius:30px;padding:11px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ord{display:block}
.ord .meta{font-size:13px;color:var(--mut);margin-top:4px}
.ord .tot{font-weight:700}
.person{border-top:1px solid var(--line);padding:10px 0}
.person:first-child{border-top:0}
.it{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:14px}
.it .n{flex:1}.it .p{white-space:nowrap}
.it .note{color:var(--mut);font-size:12px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--mut);font-weight:600;font-size:13px}
.num{text-align:end;white-space:nowrap}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:4px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut)}
.mfoot{display:flex;gap:8px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip:hover,.chip.on{border-color:var(--pri);color:var(--pri)}
.chip small{color:var(--mut)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.auth{max-width:380px;margin:9vh auto 0}
.auth .logo{font-size:26px;font-weight:700;color:var(--pri);text-align:center;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
pre.sum{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;margin:0 0 10px}
.dayh{font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.loading{text-align:center;color:var(--mut);padding:40px}
.wheelbox{position:relative;width:min(100%,360px);aspect-ratio:1;margin:0 auto}.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--bad);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:var(--card);border:4px solid var(--pri);display:grid;place-items:center;font-weight:700;color:var(--pri);font-size:13px;z-index:2}
.wstatus{min-height:28px;text-align:center;font-weight:700;margin:10px 0 6px;color:var(--mut)}.wbig{font-size:17px;padding:11px 26px;border-radius:30px}
.chip.off{text-decoration:line-through;opacity:.6}.wres{text-align:center;margin-top:12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wwin{font-size:28px;font-weight:900;color:var(--bad)}.order-box{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:start;font-size:14px;margin:8px 0 10px}
.runner{background:var(--badbg);color:var(--bad);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>
</head>
<body>
<div id="app"><div class="loading">جاري التحميل…</div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, collectionGroup, doc, addDoc, setDoc, updateDoc, deleteDoc,
         onSnapshot, query, orderBy, serverTimestamp, writeBatch, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================== الإعدادات — غيّرها ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAwG62q5EdBoKQaq8Pf8sMQPgj5zKtseCI",
  authDomain: "office-breakfast-c9338.firebaseapp.com",
  projectId: "office-breakfast-c9338",
  storageBucket: "office-breakfast-c9338.firebasestorage.app",
  messagingSenderId: "119293186533",
  appId: "1:119293186533:web:faea52c1afa25eb7aa1f0c"
};
const CURRENCY = "ج.م";      // العملة اللي بتظهر جنب الأرقام
// الأصناف الثابتة اللي بتظهر للاختيار السريع (تتعدّل من صفحة المنيوهات)
const DEFAULT_CATALOG = ["فول", "بيض", "فول بالبيض", "بطاطس", "بطاطس جمبري", "فلافل"];
/* ============================================================ */

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const S = { me:null, users:{}, orders:[], items:{}, transfers:[], rests:[], catalog:[], admins:null, carry:{}, notes:{}, notesFor:null, notesUnsub:null,
            loaded:{}, unsubs:[], otab:'people', hf:'all', q:'', authMode:'login' };
const isAdmin = () => !!S.admins?.includes(me());

/* ---------- أدوات ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = n => `${r2(n).toLocaleString('en-US',{maximumFractionDigits:2})} ${CURRENCY}`;
const me = () => S.me?.uid;
const uname = uid => S.users[uid]?.name || 'مستخدم';
const yesterdayStr = () => dayOfTs({ toMillis:()=>Date.now()-864e5 });
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const tsOf = x => x?.toMillis ? x.toMillis() : Date.now();
const dayLabel = s => { if (s === todayStr()) return 'النهارده'; if (s === yesterdayStr()) return 'امبارح'; const d = new Date(s + 'T00:00'); return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}); };
const timeOf = x => new Date(tsOf(x)).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
const STATUS = { open:'مفتوحة للطلب', closed:'اتقفلت واتطلبت', cancelled:'اتلغت' };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function errMsg(e){
  const c = e?.code || '';
  const m = {
    'permission-denied':'مش مسموح لك تعمل ده',
    'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الإيميل أو الباسورد غلط','auth/user-not-found':'الإيميل ده مش متسجّل',
    'auth/email-already-in-use':'الإيميل ده متسجّل قبل كده','auth/weak-password':'الباسورد لازم 6 حروف على الأقل',
    'auth/invalid-email':'الإيميل مكتوب غلط','auth/too-many-requests':'محاولات كتير — استنى شوية','unavailable':'مفيش اتصال بالنت'
  };
  return m[c] || m[c.replace('firestore/','')] || (e?.message || 'حصل خطأ');
}
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('اتنسخ'); }catch{ toast('النسخ مش متاح'); } }

/* ---------- الحسابات ---------- */
function orderCalc(o){
  const its = (S.items[o.id] || []).slice().sort((a,b)=>tsOf(a.createdAt)-tsOf(b.createdAt));
  const per = {};
  for (const it of its){
    const p = per[it.uid] ??= { uid:it.uid, items:[], sub:0 };
    p.items.push(it); p.sub += (+it.qty||0) * (+it.price||0);
  }
  const parts = Object.values(per);
  const fee = +o.fee || 0, share = parts.length ? fee / parts.length : 0;
  parts.forEach(p => p.total = p.sub + share);
  const subtotal = parts.reduce((a,p)=>a+p.sub,0);
  return { its, parts, fee, share, subtotal, total: subtotal + fee };
}
// pair[a][b] موجب = b عليه لـ a
function ledger(){
  const net = {}, pair = {};
  const add = (cr, dr, amt) => {
    if (!cr || !dr || cr === dr || !amt) return;
    net[cr] = (net[cr]||0) + amt; net[dr] = (net[dr]||0) - amt;
    (pair[cr] ??= {})[dr] = (pair[cr][dr]||0) + amt;
    (pair[dr] ??= {})[cr] = (pair[dr][cr]||0) - amt;
  };
  for (const o of S.orders){
    if (o.status !== 'closed' || !o.payerUid) continue;
    for (const p of orderCalc(o).parts) add(o.payerUid, p.uid, p.total);
  }
  for (const t of S.transfers) if (t.confirmed) add(t.fromUid, t.toUid, +t.amount||0);
  // الأرصدة المرحّلة من البيانات القديمة اللي اتمسحت
  for (const [k, v] of Object.entries(S.carry)){ const [a, b] = k.split('_'); if (v > 0) add(a, b, v); else if (v < 0) add(b, a, -v); }
  return { net, pair };
}
// مفتاح الترحيل: "a_b" مترتب — موجب = b عليه لـ a
const carryKey = (cr, dr) => cr < dr ? [`${cr}_${dr}`, 1] : [`${dr}_${cr}`, -1];
function contribution(orders, transfers){
  const out = {};
  const add = (cr, dr, amt) => { if (!cr || !dr || cr===dr || !amt) return; const [k, s] = carryKey(cr, dr); out[k] = (out[k]||0) + s*amt; };
  for (const o of orders){ if (o.status !== 'closed' || !o.payerUid) continue; for (const p of orderCalc(o).parts) add(o.payerUid, p.uid, p.total); }
  for (const t of transfers) if (t.confirmed) add(t.fromUid, t.toUid, +t.amount||0);
  return out;
}

/* ---------- الاستماع للبيانات (Realtime) ---------- */
function startListeners(){
  const L = (name, ref, fn) => S.unsubs.push(onSnapshot(ref, snap => { fn(snap); S.loaded[name]=true; render(); }, e => toast(errMsg(e))));
  L('users', collection(db,'users'), snap => {
    S.users = {}; snap.forEach(d => S.users[d.id] = { id:d.id, ...d.data() });
    if (!S.users[me()]) setDoc(doc(db,'users',me()), { name: S.me.displayName || S.me.email.split('@')[0], email:S.me.email, payInfo:'', createdAt:serverTimestamp() }).catch(()=>{});
  });
  L('orders', query(collection(db,'orders'), orderBy('createdAt','desc')), snap => {
    S.orders = snap.docs.map(d => ({ id:d.id, ...d.data({serverTimestamps:'estimate'}) }));
  });
  L('items', collectionGroup(db,'items'), snap => {
    S.items = {};
    snap.forEach(d => { const oid = d.ref.parent.parent.id; (S.items[oid] ??= []).push({ id:d.id, oid, ...d.data({serverTimestamps:'estimate'}) }); });
  });
  L('transfers', query(collection(db,'transfers'), orderBy('createdAt','desc')), snap => {
    S.transfers = snap.docs.map(d => ({ id:d.id, ...d.data({serverTimestamps:'estimate'}) }));
  });
  L('rests', collection(db,'restaurants'), snap => {
    S.rests = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  });
  L('config', doc(db,'config','app'), d => { S.admins = d.exists() ? (d.data().admins || []) : null; });
  L('carry', doc(db,'carry','pairs'), d => { S.carry = d.exists() ? (d.data().pairs || {}) : {}; });
  L('catalog', doc(db,'config','catalog'), d => { S.catalog = d.exists() ? (d.data().items || []) : DEFAULT_CATALOG.map(name => ({ name, price:0 })); });
}
function stopListeners(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.loaded={}; watchNotes(null); }
// ملاحظات الطلبية: بنسمع لها بس وانت فاتح الطلبية (توفير قراءات)
function watchNotes(oid){
  if (S.notesFor === oid) return;
  S.notesUnsub?.(); S.notesUnsub = null; S.notesFor = oid;
  if (!oid) return;
  S.notesUnsub = onSnapshot(query(collection(db,'orders',oid,'notes'), orderBy('createdAt')), snap => {
    S.notes[oid] = snap.docs.map(d => ({ id:d.id, ...d.data({serverTimestamps:'estimate'}) })); render();
  }, e => toast(errMsg(e)));
}

/* ---------- الرسم ---------- */
let raf = 0;
function render(){ if (raf) return; raf = requestAnimationFrame(()=>{ raf=0; doRender(); }); }
function doRender(){
  const app = $('#app');
  if (!S.me){ app.innerHTML = vAuth(); return; }
  if (!['users','orders','items','transfers','rests','config','carry','catalog'].every(k=>S.loaded[k])){ app.innerHTML = '<div class="loading">جاري تحميل البيانات…</div>'; return; }
  const ae = document.activeElement, aid = ae?.id, s1 = ae?.selectionStart, s2 = ae?.selectionEnd;
  const [route, arg] = (location.hash.slice(1) || 'home').split('/');
  watchNotes(route === 'order' ? arg : null);
  const V = { home:vHome, order:()=>vOrder(arg), history:vHistory, money:vMoney, transfers:vTransfers, menus:vMenus, profile:vProfile, report:vReport };
  app.innerHTML = shell(route, (V[route] || vHome)());
  if (aid){ const el = document.getElementById(aid); if (el){ el.focus(); try{ el.setSelectionRange(s1,s2); }catch{} } }
}
function shell(route, body){
  const pend = S.transfers.filter(t => t.toUid===me() && !t.confirmed && !t.rejected).length;
  const tab = (r, label, extra='') => `<a href="#${r}" class="${route===r || (r==='home'&&route==='order')?'on':''}">${label}${extra}</a>`;
  return `<header class="top"><div class="in"><a href="#home" class="brand"><img src="icon.png" alt="">فطار المكتب</a><span class="sp"></span><a href="#profile" class="who">${esc(uname(me()))}</a></div></header>
  <main class="wrap">${body}</main>
  <nav class="tabs">${tab('home','الرئيسية')}${tab('history','الطلبيات')}${tab('money','الحساب')}${tab('transfers','التحويلات', pend?` <span class="badge">${pend}</span>`:'')}${tab('menus','المنيوهات')}${tab('profile','حسابي')}</nav>`;
}

/* ---------- شاشة الدخول ---------- */
function vAuth(){
  const sign = S.authMode === 'signup';
  return `<div class="wrap"><div class="auth card">
    <div class="logo"><img src="icon.png" alt="">فطار المكتب</div>
    <p class="mut" style="text-align:center;margin-top:0">الطلبات والتجميع والحساب في مكان واحد</p>
    <div style="text-align:center;margin-bottom:14px"><div class="seg">
      <button type="button" class="${!sign?'on':''}" data-act="authMode" data-id="login">دخول</button>
      <button type="button" class="${sign?'on':''}" data-act="authMode" data-id="signup">حساب جديد</button></div></div>
    <form id="authForm">
      ${sign ? '<label>اسمك (اللي هيظهر للناس)<input name="name" required></label>' : ''}
      <label>الإيميل<input name="email" type="email" required autocomplete="email"></label>
      <label>الباسورد<input name="pass" type="password" required minlength="6" autocomplete="${sign?'new-password':'current-password'}"></label>
      <button class="btn pri" style="width:100%" type="submit">${sign?'اعمل الحساب':'ادخل'}</button>
    </form>
    ${!sign ? '<p style="text-align:center;margin-bottom:0"><a href="#" data-act="forgot" class="mut">نسيت الباسورد؟</a></p>' : ''}
  </div></div>`;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  const f = new FormData(e.target), btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
  try{
    if (S.authMode === 'signup'){
      const name = f.get('name').trim();
      const cred = await createUserWithEmailAndPassword(auth, f.get('email').trim(), f.get('pass'));
      await updateProfile(cred.user, { displayName:name });
      await setDoc(doc(db,'users',cred.user.uid), { name, email:cred.user.email, payInfo:'', createdAt:serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, f.get('email').trim(), f.get('pass'));
    }
  }catch(err){ toast(errMsg(err)); btn.disabled = false; }
});

/* ---------- الرئيسية ---------- */
function myTotals(){
  const mine = ledger().pair[me()] || {}; let owed=0, owe=0;
  for (const v of Object.values(mine)){ if (v > 0.009) owed += v; else if (v < -0.009) owe -= v; }
  return { owed, owe };
}

  const c = orderCalc(o), mineIn = c.parts.some(p=>p.uid===me());

}

function summaryText(o){
  const c = orderCalc(o), g = {};
  for (const it of c.its){
    const k = it.name.trim() + '||' + (it.note||'').trim();
    (g[k] ??= { name:it.name.trim(), note:(it.note||'').trim(), qty:0 }).qty += +it.qty||0;
  }
  const lines = Object.values(g).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(x => `• ${r2(x.qty)} × ${x.name}${x.note?` (${x.note})`:''}`);
  return `${o.title}${o.restaurantName?' — '+o.restaurantName:''}\n${lines.join('\n')}\n\nعدد الأصناف: ${lines.length} · الإجمالي: ${money(c.total)}`;

function vTransfers(){

    return `<div class="person"><div class="between">

      ${t.rejected ? `<div class="bad" style="font-size:13px;margin-top:4px">${esc(uname(t.toUid))} بيقول الفلوس موصلتش — ومش محسوبة في الحساب.</div>` : ''}
      ${!t.confirmed && !t.rejected && toMe ? `<div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="confirmTr" data-id="${t.id}">وصلني</button><button class="btn sm dan" data-act="rejectTr" data-id="${t.id}">موصلش</button></div>`:''}

      ${!t.confirmed && fromMe ? `<div class="row" style="margin-top:6px">${t.rejected ? `<button class="btn sm pri" data-act="swearTr" data-id="${t.id}">والله حوّلت!</button>` : ''}<button class="btn sm dan" data-act="delTr" data-id="${t.id}">امسحه</button></div>`:''}

}
// جمل هزار للتحويل اللي موصلش — ثابتة لكل تحويل
const THIEF = ['امسك حرامي!', 'تحويل بالنية', 'الفلوس ضلّت الطريق', 'حوّل على الهوا', 'لسه في الطريق… من سنة', 'البنك بيقول مشفناهوش'];
const thiefLine = id => THIEF[[...String(id)].reduce((a,c)=>a + c.charCodeAt(0), 0) % THIEF.length];
function dayOfTs(x){ const d = new Date(tsOf(x)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

const WCOLORS = ['#0f766e', '#f59e0b', '#14b8a6', '#b45309', '#0d9488', '#d97706', '#115e59', '#ca8a04'];
const pick = a => a[Math.floor(Math.random() * a.length)];

function wDraw(){
  const cv = $('#wheel'); if (!cv) return;
  const ctx = cv.getContext('2d'), ids = wActive(), n = ids.length, R = cv.width / 2, seg = 2 * Math.PI / Math.max(n, 1);
  ctx.clearRect(0, 0, cv.width, cv.height); ctx.save(); ctx.translate(R, R);
  ctx.beginPath(); ctx.arc(0, 0, R - 4, 0, 2 * Math.PI); ctx.fillStyle = '#1c2321'; ctx.fill();
  if (!n){ ctx.fillStyle = '#fff'; ctx.font = '700 34px Cairo, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('محدش فاضل!', 0, 12); ctx.restore(); return; }
  for (let i = 0; i < n; i++){
    const a0 = W.rot + i * seg;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R - 16, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = WCOLORS[i % WCOLORS.length]; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.rotate(a0 + seg / 2); ctx.fillStyle = '#fff'; ctx.font = `700 ${n > 8 ? 26 : 32}px Cairo, sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    const nm = uname(ids[i]); ctx.fillText(nm.length > 14 ? nm.slice(0, 13) + '…' : nm, R - 40, 0); ctx.restore();
  }
  for (let k = 0; k < 24; k++){ const a = k * Math.PI / 12; ctx.beginPath(); ctx.arc(Math.cos(a) * (R - 9), Math.sin(a) * (R - 9), 4, 0, 2 * Math.PI); ctx.fillStyle = k % 2 ? '#fde68a' : '#fff'; ctx.fill(); }
  ctx.restore();
}

function confetti(){
  let c = $('#confetti'); if (!c){ c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({length: 140}, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 5, a: Math.random() * 6, col: WCOLORS[Math.floor(Math.random() * WCOLORS.length)] }));
  const t0 = performance.now();
  (function f(now){ x.clearRect(0, 0, c.width, c.height);
    for (const p of P){ p.x += p.vx; p.y += p.vy; p.a += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.col; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); }
    if (now - t0 < 3500) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(t0);
}

    if (!email) return toast('اكتب الإيميل الأول');

  copyTxt: id => copy(id),
  copySum: id => copy(summaryText(S.orders.find(o=>o.id===id))),
  wheel: oid => {
    const o = S.orders.find(x => x.id === oid); if (!o) return;
    const ids = [...new Set((S.items[oid] || []).map(i => i.uid))];
    W.oid = oid; W.all = ids.length ? ids : Object.keys(S.users); W.obj = 0; W.spinning = false;
    W.last = S.orders.find(x => x.id !== oid && x.runnerUid)?.runnerUid;
    W.ex = new Set(W.last && W.all.includes(W.last) && W.all.length > 2 ? [W.last] : []);
    sheet('مين هينزل؟', `<p class="mut" style="margin:-6px 0 10px;text-align:center;font-size:14px">العجلة هي اللي هتقرر، ومحدش ليه حق الاعتراض</p>
      <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="760" height="760"></canvas><div class="hub">العجلة</div></div>
      <div class="wstatus" id="wstatus">${o.runnerUid ? `آخر قرار: ${esc(uname(o.runnerUid))}` : 'جاهزين؟ حد يدوس'}</div>
      <div class="row" style="justify-content:center"><button type="button" class="btn pri wbig" id="wspin" data-act="spinWheel">لِف العجلة</button></div>
      <div id="wresult"></div>
      <div style="margin-top:14px"><b style="font-size:14px">مين داخل القرعة؟</b><div class="mut" style="font-size:12px;margin-bottom:6px">دوس على الاسم علشان تعفيه (نزل قبل كده، عنده اجتماع، رجله وجعاه…)</div><div class="chips" id="wpeople"></div></div>`);
    wPeople(); wDraw(); wResult(o); document.fonts?.ready.then(wDraw);
  },
  wToggle: uid => { if (W.spinning) return; W.ex.has(uid) ? W.ex.delete(uid) : W.ex.add(uid); wPeople(); wDraw(); },
  wObject: () => { W.obj++; const el = $('#wobj'); if (el) el.textContent = W.obj >= 3 ? 'خلاص اتعاقبت: هتنزل بكرة كمان' : pick(OBJECTIONS); },
  spinWheel: (again) => {
    const ids = wActive(); if (W.spinning) return;
    if (ids.length < 2) return wStatus(ids.length ? `${uname(ids[0])} لوحده؟ يبقى هو اللي هينزل من غير عجلة` : 'رجّع حد للقرعة الأول');
    W.spinning = true; W.obj = 0; const r = $('#wresult'); if (r) r.innerHTML = '';
    if (again === 'again') wStatus('اللفة التانية بتتسجل في المحضر… وكله شايف');
    const btn = $('#wspin'); if (btn) btn.disabled = true;
    const n = ids.length, seg = 2 * Math.PI / n, win = crypto.getRandomValues(new Uint32Array(1))[0] % n;
    const base = -Math.PI / 2 - (win + .5) * seg + (Math.random() - .5) * seg * .7;
    const start = W.rot, target = base + 2 * Math.PI * (Math.ceil((start - base) / (2 * Math.PI)) + 6 + Math.floor(Math.random() * 3));
    const dur = 6000, t0 = performance.now(); let lastSeg = -1, lineAt = t0;
    const frame = now => {
      if (!$('#wheel')) { W.spinning = false; return; }
      const t = Math.min(1, (now - t0) / dur); W.rot = start + (target - start) * (1 - Math.pow(1 - t, 4)); wDraw();
      const s = Math.floor((((-Math.PI / 2 - W.rot) % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI) / seg);
      if (s !== lastSeg){ lastSeg = s; tick(); }
      if (now - lineAt > 900){ lineAt = now; wStatus(pick(SPIN_LINES)); }

  cleanup: async days => {
    const cut = dayOfTs({ toMillis:()=>Date.now() - (+days)*864e5 }), cutMs = Date.now() - (+days)*864e5;
    const orders = S.orders.filter(o => o.day < cut && o.status !== 'open');
    const trs = S.transfers.filter(t => t.confirmed && tsOf(t.createdAt) < cutMs);
    if (!orders.length && !trs.length) return toast('مفيش بيانات قديمة');
    if (!confirm(`هيتمسح ${orders.length} طلبية و${trs.length} تحويل أقدم من ${days} يوم، والأرصدة هتترحّل. متأكد؟`)) return;
    // كل دفعة ذرّية: الترحيل + المسح مع بعض — لو دفعة فشلت مفيش ازدواج في الحساب
    const units = [...orders.map(o => ({ o })), ...trs.map(t => ({ t }))];
    let batch = writeBatch(db), ops = 0, inc = {}, done = 0;
    const flush = async () => {
      if (!ops) return;
      const upd = {}; for (const [k,v] of Object.entries(inc)) if (Math.abs(v) > 0.0001) upd[k] = increment(r2(v));
      if (Object.keys(upd).length) batch.set(doc(db,'carry','pairs'), { pairs: Object.fromEntries(Object.entries(upd)) }, { merge:true });
      await batch.commit(); batch = writeBatch(db); ops = 0; inc = {};
    };
    for (const u of units){
      const refs = [];
      if (u.o){
        (S.items[u.o.id] || []).forEach(i => refs.push(doc(db,'orders',u.o.id,'items',i.id)));
        (await getDocs(collection(db,'orders',u.o.id,'notes'))).forEach(n => refs.push(n.ref));
        refs.push(doc(db,'orders',u.o.id));
      } else refs.push(doc(db,'transfers',u.t.id));
      if (ops + refs.length > 400) await flush();
      const c = contribution(u.o ? [u.o] : [], u.t ? [u.t] : []);
      for (const [k,v] of Object.entries(c)) inc[k] = (inc[k]||0) + v;
      refs.forEach(r => batch.delete(r)); ops += refs.length; done++;
    }
    await flush();
    toast(`اتمسح ${done} سجل والأرصدة اترحّلت`);
  },

// "الاسم | السعر" لكل سطر — السعر اختياري (0 = استخدم السعر الافتراضي)
function parseLines(txt){
  return String(txt||'').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)\s*[|:،,\-–]\s*([\d.]+)\s*$/); return m ? { name:m[1].trim(), price:+m[2] } : { name:l.replace(/[|:،,\-–]\s*$/,'').trim(), price:0 };
  }).filter(x => x.name);
}
// جدول أسعار: صف لكل صنف + 3 صفوف فاضية لأصناف جديدة
// جدول أسعار: صف لكل صنف + زرار يضيف صفوف بلا حد + بحث + إضافة كذا صنف مرة واحدة
let rowSeq = 0;
const priceRow = (m = {}) => { const i = rowSeq++; return `<div class="prow" style="display:grid;grid-template-columns:1fr 110px;gap:10px;margin-bottom:6px"><input name="n_${i}" value="${esc(m.name||'')}" placeholder="اسم الصنف" style="margin:0"><input name="p_${i}" type="number" min="0" step="any" value="${+m.price ? m.price : ''}" placeholder="السعر" style="margin:0"></div>`; };
function priceRows(items){
  return `${items.length > 8 ? `<input id="rowq" placeholder="دوّر على صنف (${items.length} صنف)" style="margin:0 0 10px">` : ''}
    <div style="display:grid;grid-template-columns:1fr 110px;gap:10px"><span class="mut" style="font-size:13px">الصنف</span><span class="mut" style="font-size:13px">السعر (${CURRENCY})</span></div>
    <div id="prows">${items.map(priceRow).join('')}${priceRow()}</div>
    <div class="row" style="margin:4px 0 12px"><button type="button" class="btn sm" data-act="addRow">+ صنف جديد</button><button type="button" class="btn sm" data-act="bulkRows">+ كذا صنف مرة واحدة</button></div>
    <label id="bulkbox" style="display:none">الصق أو اكتب الأصناف — كل صنف في سطر: الاسم | السعر<textarea name="bulk" rows="6" placeholder="فول | 10&#10;طعمية | 3&#10;عيش | 1"></textarea></label>`;
}
function readPriceRows(f){
  const out = new Map();
  for (const [k, v] of f.entries()){ if (!k.startsWith('n_')) continue; const name = String(v).trim(); if (name && !out.has(name)) out.set(name, +f.get('p_' + k.slice(2)) || 0); }
  for (const m of parseLines(f.get('bulk'))) if (!out.has(m.name) || m.price) out.set(m.name, m.price || out.get(m.name) || 0);
  return [...out].map(([name, price]) => ({ name, price }));
}
// إضافة صنف من الفورم + حفظ سعره لو كان ناقص أو اتغيّر (علشان يتكتب مرة واحدة)
async function addItemFromForm(o, f){
  const name = f.get('name').trim(), price = +f.get('price');
  await addDoc(collection(db,'orders',o.id,'items'), { uid:me(), orderId:o.id, name, qty:+f.get('qty'), price, note:f.get('note').trim(), createdAt:serverTimestamp() });
  await savePrice(o, name, price).catch(()=>{});
}
async function savePrice(o, name, price){
  if (!price || price === priceFor(o, name)) return;
  const r = S.rests.find(x => x.id === o.restaurantId);
  if (r){ // سعر خاص بالمطعم
    const items = (r.items||[]).map(m => ({...m})), m = items.find(x => x.name === name);
    if (m) m.price = price; else items.push({ name, price });
    await updateDoc(doc(db,'restaurants',r.id), { items });
  }
  const cat = S.catalog.map(m => ({...m})), c = cat.find(m => m.name === name);
  if (c && !+c.price){ c.price = price; await setDoc(doc(db,'config','catalog'), { items:cat, updatedBy:me(), updatedAt:serverTimestamp() }); }
  else if (!c && !r){ cat.push({ name, price }); await setDoc(doc(db,'config','catalog'), { items:cat, updatedBy:me(), updatedAt:serverTimestamp() }); }
}
// سعر الصنف: سعر المطعم لو موجود، وإلا السعر الافتراضي
function priceFor(o, name){
  const r = S.rests.find(x => x.id === o.restaurantId);
  const rp = r?.items?.find(m => m.name === name)?.price;
  if (+rp) return +rp;
  return +(S.catalog.find(m => m.name === name)?.price) || 0;
}
// الأصناف المعروضة للاختيار: الثابتة + أصناف المطعم، بأسعار المطعم
function quickList(o){
  const names = [...new Set([...S.catalog.map(m=>m.name), ...((S.rests.find(x=>x.id===o.restaurantId)?.items)||[]).map(m=>m.name)])];
  return names.map(name => ({ name, price: priceFor(o, name) }));
}
function restModal(r = {}){
  const base = r.id ? (r.items||[]) : S.catalog.map(m => ({ name:m.name, price:m.price }));

}

function vReport(){
  const months = [...new Set(S.orders.filter(o => o.status === 'closed').map(o => (o.day||'').slice(0,7)))].filter(Boolean).sort().reverse();
  const cur = todayStr().slice(0,7);
  if (!months.includes(cur)) months.unshift(cur);
  const m = S.rm && months.includes(S.rm) ? S.rm : months[0];
  const mName = ym => new Date(ym + '-01T00:00').toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
  const orders = S.orders.filter(o => o.status === 'closed' && (o.day||'').startsWith(m));
  const per = {}, items = {}, days = {};
  let total = 0;
  for (const o of orders){
    const c = orderCalc(o); total += c.total; days[o.day] = (days[o.day]||0) + c.total;
    for (const p of c.parts){ const x = per[p.uid] ??= { uid:p.uid, spent:0, orders:0, runs:0, qty:{} }; x.spent += p.total; x.orders++; for (const it of p.items){ x.qty[it.name] = (x.qty[it.name]||0) + (+it.qty||0); } }
    for (const it of c.its) items[it.name] = (items[it.name]||0) + (+it.qty||0);
    if (o.runnerUid){ (per[o.runnerUid] ??= { uid:o.runnerUid, spent:0, orders:0, runs:0, qty:{} }).runs++; }
  }
  const people = Object.values(per).sort((a,b) => b.spent - a.spent);
  const topItems = Object.entries(items).sort((a,b) => b[1] - a[1]);
  const dayList = Object.entries(days).sort((a,b) => b[1] - a[1]);
  const mine = per[me()];
  const best = (fn) => people.filter(fn).length ? people.filter(fn).reduce((a,b) => fn(b) > fn(a) ? b : a) : null;
  const tKing = best(p => p.qty['طعمية'] || p.qty['فلافل'] || 0);
  const runner = best(p => p.runs);
  const saver = people.filter(p => p.orders).sort((a,b) => a.spent/a.orders - b.spent/b.orders)[0];
  const big = people[0];
  const title = (label, p, val) => p ? `<div class="person"><div class="between"><span>${label}</span><b>${esc(uname(p.uid))}${val ? ` <span class="mut" style="font-weight:400">(${val})</span>` : ''}</b></div></div>` : '';
  return `<div class="between" style="margin:18px 0 10px"><h2 style="margin:0">تقرير الشهر</h2>
    <select id="rmonth" style="width:auto;margin:0">${months.map(x => `<option value="${x}" ${x===m?'selected':''}>${mName(x)}</option>`).join('')}</select></div>
  ${!orders.length ? '<div class="card empty">مفيش طلبيات مقفولة في الشهر ده لسه</div>' : `
  <div class="stats">
    <div class="stat ok"><small>انت صرفت</small><b>${money(mine?.spent||0)}</b><small>${mine?.orders||0} طلبية${mine?.runs ? ` · نزلت ${mine.runs} مرة` : ''}</small></div>
    <div class="stat" style="background:var(--pri2);color:var(--pri)"><small>المكتب كله صرف</small><b>${money(total)}</b><small>${orders.length} طلبية · ${people.length} شخص</small></div>
  </div>
  <h2>ألقاب الشهر</h2>
  <div class="card">
    ${title('ملك الطعمية', tKing, tKing ? `${r2(tKing.qty['طعمية'] || tKing.qty['فلافل'])} واحدة` : '')}
    ${title('بطل العربية (أكتر واحد نزل)', runner, runner ? `${runner.runs} مرة` : '')}
    ${title('رجل الأعمال (أكتر واحد صرف)', big, big ? money(big.spent) : '')}
    ${title('المحافظ الاقتصادي (أقل متوسط للطلبية)', saver, saver ? money(saver.spent / saver.orders) + ' للطلبية' : '')}
  </div>
  <h2>كل واحد صرف كام</h2>
  <div class="card"><table><tr><th>الاسم</th><th class="num">طلبيات</th><th class="num">نزل</th><th class="num">صرف</th></tr>
    ${people.map(p => `<tr><td>${esc(uname(p.uid))}${p.uid===me()?' (انت)':''}</td><td class="num">${p.orders}</td><td class="num">${p.runs||'—'}</td><td class="num"><b>${money(p.spent)}</b></td></tr>`).join('')}</table></div>

  <div class="card">${topItems.slice(0,8).map(([n,q], i) => `<div class="it"><span class="n">${i+1}. ${esc(n)}</span><span class="p"><b>${r2(q)}</b></span></div>`).join('')}</div>

    ${dayList.length > 1 ? `<div class="it"><span class="n">أرخص يوم: ${dayLabel(dayList[dayList.length-1][0])}</span><span class="p ok"><b>${money(dayList[dayList.length-1][1])}</b></span></div>` : ''}
    <div class="it mut"><span class="n">متوسط اليوم</span><span class="p">${money(total / dayList.length)}</span></div>

function payBox(uid){
  const p = S.users[uid]?.payInfo;
  return p ? `<div class="card" style="background:var(--pri2);border-color:var(--pri);margin:0 0 10px;padding:10px 12px"><div class="between"><div><div class="mut" style="font-size:12px">حوّل على (انستاباي / محفظة):</div><b style="font-size:17px;direction:ltr;unicode-bidi:embed">${esc(p)}</b></div><button type="button" class="btn sm pri" data-act="copyTxt" data-id="${esc(p)}">نسخ</button></div></div>`
           : `<div class="mut" style="font-size:13px;margin:-4px 0 10px">${esc(uname(uid))} لسه مكتبش رقم التحويل بتاعه — يكتبه من «حسابي».</div>`;
}
window.addEventListener('hashchange', () => { S.otab = 'people'; render(); window.scrollTo(0,0); });

onAuthStateChanged(auth, user => {
  stopListeners(); S.me = user; closeModal();
  if (user) startListeners();
  doRender();
});
</script>
